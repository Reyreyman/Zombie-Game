<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VILLAGE SIEGE</title>
<style>
  :root{
    --bone:#f2ead7;
    --dust:#c9b997;
    --ink:#141210;
    --amber:#ffb23f;
    --rust:#c8452c;
    --olive:#7d8a4f;
    --panel:rgba(18,16,13,.62);
    --stroke:rgba(242,234,215,.28);
    --display:"Arial Narrow","Haettenschweiler","Impact",system-ui,sans-serif;
    --mono:ui-monospace,"SF Mono","Consolas","Roboto Mono",monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#0a0908;color:var(--bone);
    font-family:var(--mono);-webkit-font-smoothing:antialiased}
  canvas{display:block;position:fixed;inset:0;z-index:0}

  /* ---------- HUD ---------- */
  #hud{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .35s;
    z-index:12}
  #hud.on{opacity:1}

  #crosshair{position:absolute;left:50%;top:50%;width:0;height:0}
  #crosshair i{position:absolute;background:var(--bone);box-shadow:0 0 3px rgba(0,0,0,.9);
    transition:opacity .12s}
  .ch-v{width:2px;height:9px;left:-1px}
  .ch-h{height:2px;width:9px;top:-1px}
  #ch-dot{width:2px;height:2px;left:-1px;top:-1px;opacity:.85}

  #hitmark{position:absolute;left:50%;top:50%;width:0;height:0;opacity:0}
  #hitmark i{position:absolute;width:2px;height:10px;background:#fff;
    transform-origin:center}
  #hitmark.show{opacity:1;animation:hm .22s ease-out}
  #hitmark.kill i{background:var(--rust)}
  @keyframes hm{from{transform:scale(.5);opacity:1}to{transform:scale(1.25);opacity:0}}

  .plate{position:absolute;background:rgba(14,12,10,.78);border:1px solid rgba(242,234,215,.4);
    backdrop-filter:blur(3px);padding:11px 16px;box-shadow:0 6px 22px rgba(0,0,0,.5)}
  .plate:before{content:"";position:absolute;inset:3px;border:1px solid rgba(242,234,215,.12);
    pointer-events:none}

  /* --- big wave disc, top centre --- */
  #wavebox{position:absolute;top:16px;left:50%;transform:translateX(-50%);text-align:center}
  #wavering{display:block;filter:drop-shadow(0 6px 20px rgba(0,0,0,.75))}
  #wavering .wr-lbl{font-family:var(--mono);font-size:12px;letter-spacing:.34em;
    fill:var(--dust);text-anchor:middle}
  #wavering #t-wave{font-family:var(--display);font-size:74px;font-weight:700;
    fill:#f2ead7;text-anchor:middle}
  #wavering .wr-sub{font-family:var(--mono);font-size:12px;letter-spacing:.26em;
    fill:var(--amber);text-anchor:middle}
  #t-left{display:inline-block;margin-top:9px;padding:6px 14px;
    background:rgba(8,7,6,.82);border:1px solid rgba(242,234,215,.4);
    font-size:11px;letter-spacing:.26em;color:var(--bone);white-space:nowrap}

  /* --- cash, sits directly on top of the health plate --- */
  #cash{left:24px;bottom:180px;display:flex;align-items:center;gap:11px;
    padding:8px 15px}
  #cash .coin{flex:none;display:block}
  #cashnum{font-family:var(--display);font-size:31px;font-weight:700;line-height:1;
    letter-spacing:.03em;text-shadow:0 2px 8px rgba(0,0,0,.8)}
  #cash .lbl{font-size:10px;letter-spacing:.3em;color:var(--dust)}

  /* --- health, bottom left --- */
  #vitals{left:24px;bottom:24px;width:312px}
  #vitals .lbl{font-size:10px;letter-spacing:.34em;color:var(--dust);margin-bottom:8px}
  #hpbar{height:28px;background:rgba(0,0,0,.72);border:2px solid var(--bone);
    position:relative;overflow:hidden}
  #hpfill{position:absolute;inset:0;width:100%;transform-origin:left;
    background:linear-gradient(180deg,#c3d472,#7f9440);transition:transform .18s}
  #hpbar:after{content:"";position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(90deg,transparent 0 27px,
      rgba(8,7,6,.75) 27px 30px)}
  #hpbar.low #hpfill{background:linear-gradient(180deg,#e8683f,#a82a17)}
  #hpnum{font-family:var(--display);font-size:48px;line-height:1;letter-spacing:.02em;
    margin-top:9px;font-weight:700;text-shadow:0 2px 10px rgba(0,0,0,.8)}
  #hpnum small{font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--dust);
    margin-left:7px;font-weight:400}
  #killrow{font-size:10px;letter-spacing:.28em;color:var(--dust);margin-top:8px}
  #killrow b{font-family:var(--display);font-size:17px;color:var(--bone);
    letter-spacing:.04em;margin-left:5px}

  /* --- ammo bullet, bottom right --- */
  #ammo{position:absolute;right:24px;bottom:24px;text-align:center;
    background:rgba(8,7,6,.78);border:1px solid rgba(242,234,215,.4);
    padding:12px 16px 14px;box-shadow:0 6px 22px rgba(0,0,0,.55)}
  #ammo .lbl{font-size:10px;letter-spacing:.32em;color:var(--dust);margin-bottom:8px}
  #ammofill{fill:var(--amber);opacity:.92;transition:y .12s,height .12s}
  #bullet.low #ammofill{fill:var(--rust)}
  #bullet #ammocount{font-family:var(--display);font-size:40px;font-weight:700;
    fill:#f2ead7;stroke:#080706;stroke-width:6;paint-order:stroke;letter-spacing:.02em}
  #bullet #ammomax{font-family:var(--mono);font-size:12px;fill:#f2ead7;
    stroke:#080706;stroke-width:4;paint-order:stroke;letter-spacing:.1em}
  #reloadbar{width:80px;height:5px;background:rgba(242,234,215,.2);margin:9px auto 0;
    opacity:0;transition:opacity .15s}
  #reloadbar.on{opacity:1}
  #reloadfill{height:100%;width:0;background:var(--amber)}

  #banner{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);
    text-align:center;opacity:0}
  #banner .b1{font-family:var(--display);font-size:70px;font-weight:700;letter-spacing:.06em;
    text-shadow:0 4px 24px rgba(0,0,0,.8)}
  #banner .b2{font-size:11px;letter-spacing:.55em;color:var(--amber);margin-top:4px}
  #banner.show{animation:bnr 2.6s ease-out}
  @keyframes bnr{
    0%{opacity:0;transform:translate(-50%,-50%) scale(1.14)}
    14%{opacity:1;transform:translate(-50%,-50%) scale(1)}
    72%{opacity:1}100%{opacity:0}}

  #breather{position:absolute;left:50%;top:222px;transform:translateX(-50%);
  /* --- wave bonus roll-up, same show/fade pattern as the wave banner --- */
  #bonus{position:absolute;left:50%;top:57%;transform:translate(-50%,-50%);
    text-align:center;opacity:0}
  #bonus .bt{font-family:var(--display);font-size:40px;font-weight:700;
    letter-spacing:.05em;color:var(--amber);text-shadow:0 3px 16px rgba(0,0,0,.85)}
  #bonus .bl{font-size:11px;letter-spacing:.28em;color:var(--bone);margin-top:8px;
    line-height:2;text-shadow:0 2px 8px rgba(0,0,0,.9)}
  #bonus.show{animation:bnr 3.4s ease-out}

  /* --- watchtower condition, tucked under the wave disc --- */
  #towerhp{margin-top:8px;padding:5px 11px 7px;background:rgba(8,7,6,.82);
    border:1px solid rgba(242,234,215,.4);opacity:0;transition:opacity .35s}
  #towerhp.on{opacity:1}
  #towerhp .lbl{font-size:9px;letter-spacing:.3em;color:var(--dust);margin-bottom:5px}
  #twbar{height:7px;width:148px;margin:0 auto;background:rgba(0,0,0,.72);
    border:1px solid var(--bone);position:relative;overflow:hidden}
  #twfill{position:absolute;inset:0;transform-origin:left;
    background:linear-gradient(180deg,#dcc78d,#9a7b3e);transition:transform .2s}
  #towerhp.low #twfill{background:linear-gradient(180deg,#e8683f,#a82a17)}
  #towerhp.down .lbl{color:var(--rust)}

  /* --- hired guns, centre left so it never reads as the player's own bar --- */
  #squad{position:absolute;left:24px;top:50%;transform:translateY(-50%);
    display:flex;flex-direction:column;gap:7px}
  .sq{display:none;align-items:center;gap:9px;width:176px;padding:6px 10px;
    background:rgba(14,12,10,.78);border:1px solid rgba(242,234,215,.4);
    box-shadow:0 4px 16px rgba(0,0,0,.45)}
  .sq.on{display:flex}
  .sq .av{flex:none;width:22px;height:22px;background:#26343b;
    border:1px solid var(--stroke);position:relative}
  .sq .av:after{content:"";position:absolute;left:4px;top:9px;width:12px;height:3px;
    background:#63d4ff;box-shadow:0 0 6px rgba(99,212,255,.9)}
  .sq .col{flex:1}
  .sq .nm{font-size:9px;letter-spacing:.24em;color:var(--dust);margin-bottom:4px}
  .sq .bar{height:6px;background:rgba(0,0,0,.72);border:1px solid var(--bone);
    position:relative;overflow:hidden}
  .sq .fill{position:absolute;inset:0;transform-origin:left;
    background:linear-gradient(180deg,#9fd8f5,#4f8fb5);transition:transform .18s}
  .sq.hurt .fill{background:linear-gradient(180deg,#e8a13f,#a8631a)}
  .sq.down{opacity:.52}
  .sq.down .nm{color:var(--rust)}
  .sq.down .fill{background:var(--rust)}
  .sq.down .av:after{background:var(--rust);box-shadow:none}

  #breather{position:absolute;left:50%;top:268px;transform:translateX(-50%);
    font-size:11px;letter-spacing:.4em;color:var(--amber);opacity:0;transition:opacity .3s;
    white-space:nowrap;text-shadow:0 2px 8px rgba(0,0,0,.9)}
  #breather.on{opacity:1}
    #hpbar{height:22px}
    #cash{left:16px;bottom:150px;padding:6px 11px;gap:9px}
    #cashnum{font-size:24px}
    #squad{left:16px}
    .sq{width:150px;padding:5px 8px}
    #twbar{width:120px}
    #ammo{right:16px;bottom:16px;padding:9px 12px 11px}
    #bullet{width:60px;height:124px}
    #reloadbar{width:60px}
    #breather{top:186px}
    #breather{top:226px}
  }

  #dmg{position:fixed;inset:0;pointer-events:none;opacity:0;z-index:10;
    text-shadow:0 2px 6px rgba(0,0,0,.9);will-change:transform,opacity}
  .float.head{color:var(--amber);font-size:27px}

  /* mop-up marker: the last few of the wave get one so you can find them */
  .mark{position:absolute;width:15px;height:15px;margin:-7px 0 0 -7px;display:none;
    background:#ff2a12;border:2px solid var(--bone);transform:rotate(45deg);
    box-shadow:0 0 10px rgba(255,42,18,.9);will-change:left,top;
    animation:markp 1s ease-in-out infinite}
  @keyframes markp{0%,100%{opacity:.62}50%{opacity:1}}

  /* ---------- screens ---------- */
  .screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;text-align:center;padding:30px;z-index:20;
      <text class="wr-sub" x="80" y="128">OF 25</text>
    </svg>
    <div id="t-left">0 ENEMIES LEFT</div>
    <div id="towerhp">
      <div class="lbl" id="twlbl">WATCHTOWER</div>
      <div id="twbar"><div id="twfill"></div></div>
    </div>
  </div>

  <div id="squad"></div>

  <div class="plate" id="cash">
    <svg class="coin" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
      <circle cx="12" cy="12" r="10" fill="#ffb23f" stroke="#f2ead7" stroke-width="1.6"/>
  </div>

  <div id="banner"><div class="b1"></div><div class="b2"></div></div>
  <div id="bonus"><div class="bt"></div><div class="bl"></div></div>
  <div id="breather"></div>
  <div id="padhint">SUPPLY PAD &middot; STEP ON THE RING TO TRADE</div>
  <div id="padhint"></div>
</div>

<div id="dmg"></div>
    <b>SPACE</b><span>jump</span>
    <b>M</b><span>mute sound</span>
    <b>ESC</b><span>pause</span>
    <b>PAD</b><span>step on the ring by the tower to trade</span>
    <b>LADDER</b><span>climb the watchtower to trade</span>
  </div>
  <button class="btn" id="btn-start">DEPLOY</button>
  <div class="sens"><span>SENSITIVITY</span>
</div>

<div class="screen hidden" id="s-shop">
  <div class="eyebrow">WATCHTOWER &middot; SUPPLY PAD</div>
  <div class="eyebrow" id="shopnote">WATCHTOWER DECK</div>
  <h1 style="font-size:clamp(30px,6vw,62px)">THE ARMOURY</h1>
  <div class="rule" style="margin:18px 0 14px"></div>
  <div id="shopcash">0<small>CASH</small></div>
  <div class="rule" style="margin:14px 0 18px"></div>
  <div id="shopgrid"></div>
  <button class="btn" id="btn-shopclose">BACK TO THE LINE</button>
  <div class="hint">Waves hold while you trade &middot; step off the ring to trade again</div>
  <div class="hint">Waves hold while you trade &middot; step out of the ring to trade again</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

}
function sfxCell(){
  if(!AUD.ctx) return; const t=AUD.ctx.currentTime;
  tone("sine",620,t,.22,.01,.16);
  tone("sine",930,t+.08,.2,.01,.2);
  tone("sine",1240,t+.16,.16,.01,.26);
}
function sfxTowerDown(){
  if(!AUD.ctx) return; const t=AUD.ctx.currentTime;
